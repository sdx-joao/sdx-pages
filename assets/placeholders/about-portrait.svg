<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAE3D7"></stop>
      <stop offset="1" stop-color="#F4F1EC"></stop>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#8C5A28" opacity="0.18"></circle>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#g)"></rect>
  <rect width="800" height="1000" fill="url(#dots)"></rect>
  <g transform="translate(400 500)" text-anchor="middle">
    <text font-family="Lato, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#1E232D" opacity="0.7" y="-12">PLACEHOLDER</text>
    <text font-family="Cherona, serif" font-size="34" fill="#1E232D" y="32">Biografia</text>
    <text font-family="Lato, sans-serif" font-size="12" letter-spacing="2" fill="#1E232D" opacity="0.55" y="64">FOTO MÉDICO 4:5</text>
  </g>
</svg>