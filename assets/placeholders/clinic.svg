  <g transform="translate(800 450)" text-anchor="middle">
    <text font-family="Lato, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#F4F1EC" opacity="0.7" y="-12">PLACEHOLDER</text>
    <text font-family="Cherona, serif" font-size="34" fill="#F4F1EC" y="32">Consultório</text>
    <text font-family="Lato, sans-serif" font-size="12" letter-spacing="2" fill="#F4F1EC" opacity="0.55" y="64">INTERIOR</text>
