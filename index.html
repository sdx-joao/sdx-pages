<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Scandex+ — Landing Page</title>
<link rel="icon" type="image/png" href="assets/submarca.png" />
<link rel="apple-touch-icon" href="assets/submarca.png" />
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#3B7BA8"/><text x="100" y="112" font-size="64" font-family="sans-serif" fill="white" text-anchor="middle">S+</text></svg></template>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,300;0,400;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #F6F7F9; }
  * { box-sizing: border-box; }
  button { transition: filter 0.2s, transform 0.2s, box-shadow 0.2s; }
  button:hover { filter: brightness(0.96); }
  a { transition: opacity 0.2s; }
  a:hover { opacity: 0.6; }
  ::selection { background: #3B7BA8; color: white; }
  @keyframes sdxpulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.5); opacity: 0.6; }
  }
  @media (max-width: 760px) {
    [data-sdx="nav"]{padding:10px 14px!important;margin:8px 8px 0!important}
    [data-sdx="nav-links"]{display:none!important}
    [data-sdx="nav-cta-text"]{display:none!important}
    [data-sdx="hero"]{grid-template-columns:1fr!important;min-height:auto!important;padding:0!important;gap:0!important}
    [data-sdx="hero-left"]{padding:88px 20px 32px!important}
    [data-sdx="hero-left"] h1{font-size:40px!important;line-height:1.05!important}
    [data-sdx="hero-left"] p{font-size:15px!important;margin-top:20px!important}
    [data-sdx="hero-right"]{padding:14px!important;border-radius:0!important;min-height:320px!important}
    [data-sdx="hero-mosaic"]{min-height:280px!important;gap:8px!important}
    [data-sdx="metrics-section"]{padding:64px 20px!important}
    [data-sdx="metrics-section"] h2{font-size:32px!important}
    [data-sdx="metrics-grid-1"]{grid-template-columns:1fr!important;margin-top:40px!important}
    [data-sdx="metrics-grid-1"]>div{border-right:none!important;padding:24px 0!important}
    [data-sdx="metrics-grid-2"]{grid-template-columns:1fr!important}
    [data-sdx="metrics-grid-2"]>div{border-right:none!important;border-bottom:1px solid rgba(255,255,255,0.12)!important;padding:24px 0!important}
    [data-sdx="about-section"]{padding:64px 20px!important}
    [data-sdx="about-section"] h2{font-size:32px!important}
    [data-sdx="about-grid"]{grid-template-columns:1fr!important;gap:40px!important}
    [data-sdx="about-visual"]{height:380px!important}
    [data-sdx="pro-section"]{padding:64px 20px!important}
    [data-sdx="pro-section"] h2{font-size:30px!important}
    [data-sdx="pro-grid"]{grid-template-columns:1fr!important;gap:32px!important}
    [data-sdx="pro-tabs"]{overflow-x:auto!important;max-width:100%!important}
    [data-sdx="services-section"]{padding:64px 20px!important}
    [data-sdx="services-header-grid"]{grid-template-columns:1fr!important;gap:20px!important}
    [data-sdx="services-header-grid"] h2{font-size:32px!important}
    [data-sdx="services-main-grid"]{grid-template-columns:1fr!important;padding:14px!important}
    [data-sdx="services-items-grid"]{grid-template-columns:1fr!important}
    [data-sdx="stack-section"]{padding:64px 20px!important}
    [data-sdx="stack-section"] h2{font-size:32px!important}
    [data-sdx="stack-grid"]{grid-template-columns:1fr 1fr!important}
    [data-sdx="stack-grid"]>div{border-right:none!important;border-bottom:1px solid #E2E8EE!important}
    [data-sdx="cta-box"]{padding:48px 24px!important;border-radius:20px!important}
    [data-sdx="cta-grid"]{grid-template-columns:1fr!important;gap:24px!important}
    [data-sdx="cta-grid"] h2{font-size:34px!important}
    [data-sdx="cta-decor"]{display:none!important}
    [data-sdx="footer-grid"]{grid-template-columns:1fr!important;gap:28px!important}
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="v2-refined-part1.jsx"></script>
<script type="text/babel" src="v2-refined-part2.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "primary": "#3B7BA8",
  "accent": "#9CC8D6",
  "headline": "controle",
  "patternIntensity": 1
}/*EDITMODE-END*/;

const { Nav, Hero, Metrics } = window.SDXP;
const { About, ScandexPro, Services, Stack, CTA, Footer } = window.SDXP_Sections;

function App() {
  const [T, setTweak] = useTweaks(TWEAK_DEFAULTS);
  return (
    <div style={{ background: '#F6F7F9', minHeight: '100vh' }}>
      <Nav T={T} />
      <Hero T={T} />
      <Metrics T={T} />
      <About T={T} />
      <ScandexPro T={T} />
      <Services T={T} />
      <Stack T={T} />
      <CTA T={T} />
      <Footer T={T} />

      <TweaksPanel>
        <TweakSection label="Identidade" />
        <TweakColor label="Cor primária" value={T.primary}
                    onChange={(v) => setTweak('primary', v)} />
        <TweakColor label="Cor de acento" value={T.accent}
                    onChange={(v) => setTweak('accent', v)} />

        <TweakSection label="Headline" />
        <TweakRadio label="Variação de copy" value={T.headline}
                    options={['controle', 'papel', 'futuro']}
                    onChange={(v) => setTweak('headline', v)} />

        <TweakSection label="Decoração" />
        <TweakSlider label="Intensidade do pattern" value={T.patternIntensity}
                     min={0} max={2} step={0.1}
                     onChange={(v) => setTweak('patternIntensity', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
