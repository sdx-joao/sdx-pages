<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Site em construção</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090a17;
      --surface: #14162c;
      --text: #fdf6ec;
      --muted: #bbb8cb;
      --accent: #f4a94c;
      --rose: #e8748a;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(232, 116, 138, .13), transparent 30%),
        radial-gradient(circle at 80% 10%, rgba(244, 169, 76, .15), transparent 32%),
        linear-gradient(160deg, var(--bg), var(--surface));
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      opacity: .34;
      background-image:
        radial-gradient(circle, #fff 0 1px, transparent 1.5px),
        radial-gradient(circle, #fff 0 1px, transparent 1.5px);
      background-position: 0 0, 48px 48px;
      background-size: 96px 96px;
      pointer-events: none;
    }

    main {
      position: relative;
      width: min(680px, 100%);
      padding: clamp(36px, 8vw, 72px);
      text-align: center;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
      background: rgba(15, 17, 37, .74);
      box-shadow: 0 32px 90px rgba(0,0,0,.38);
      backdrop-filter: blur(16px);
    }

    .orbit {
      width: 88px;
      height: 88px;
      margin: 0 auto 30px;
      display: grid;
      place-items: center;
      border: 2px solid rgba(232, 116, 138, .78);
      border-radius: 50%;
      transform: rotate(-18deg);
    }

    .planet {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--rose));
      box-shadow: 0 0 38px rgba(244, 169, 76, .38);
    }

    p.label {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -.04em;
    }

    p.message {
      max-width: 460px;
      margin: 24px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.15rem);
      line-height: 1.7;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 34px;
      padding: 10px 16px;
      color: var(--text);
      font-size: .86rem;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      background: rgba(255,255,255,.04);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px var(--accent);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      50% { opacity: .35; transform: scale(.78); }
    }
  </style>
</head>
<body>
  <main>
    <div class="orbit" aria-hidden="true"><div class="planet"></div></div>
    <p class="label">Novidades a caminho</p>
    <h1>Site em construção.</h1>
    <p class="message">Estamos preparando algo especial por aqui. Volte em breve para conferir.</p>
    <div class="status"><span class="dot"></span> Trabalhando nos últimos detalhes</div>
  </main>
</body>
</html>
